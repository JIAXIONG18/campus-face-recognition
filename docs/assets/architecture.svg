<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="校园人脸识别系统架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .title { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 16px; font-weight: 600; fill: #0f172a; }
      .body  { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 12.5px; fill: #475569; }
      .tag   { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .note  { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 12.5px; fill: #64748b; }
      .num   { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect x="6" y="6" width="1068" height="628" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- section tags -->
  <rect x="40" y="34" width="128" height="30" rx="15" fill="#6366f1"/>
  <text x="104" y="54" text-anchor="middle" class="tag">离线 · 训练与评测</text>
  <rect x="570" y="34" width="112" height="30" rx="15" fill="#0ea5e9"/>
  <text x="626" y="54" text-anchor="middle" class="tag">在线 · Web 服务</text>

  <!-- LEFT column -->
  <rect x="40" y="90" width="470" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="70" cy="118" r="12" fill="#6366f1"/>
  <text x="70" y="122.5" text-anchor="middle" class="num">1</text>
  <text x="92" y="123" class="title">公开人脸数据集</text>
  <text x="64" y="150" class="body">LFW 5,749 身份 / 13,233 张（主实验）</text>
  <text x="64" y="170" class="body">CelebA · ChokePoint · CelebA-Spoof（跨域与活体）</text>

  <path d="M 275 188 L 275 206" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="210" width="470" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="70" cy="238" r="12" fill="#6366f1"/>
  <text x="70" y="242.5" text-anchor="middle" class="num">2</text>
  <text x="92" y="243" class="title">对齐与数据划分</text>
  <text x="64" y="270" class="body">YuNet 检测 + 五点相似变换 → 112 × 112</text>
  <text x="64" y="290" class="body">预训练 801 类 / 目标 50 类 / 验证 / 测试 / 冒充</text>

  <path d="M 275 308 L 275 326" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="470" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="70" cy="358" r="12" fill="#6366f1"/>
  <text x="70" y="362.5" text-anchor="middle" class="num">3</text>
  <text x="92" y="363" class="title">两阶段训练</text>
  <text x="64" y="390" class="body">801 类预训练 20 epoch → 50 类微调 60 epoch</text>
  <text x="64" y="410" class="body">ArcFace m=0.2 / s=32 · SGD + Cosine · AMP</text>

  <path d="M 275 428 L 275 446" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="450" width="470" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="70" cy="478" r="12" fill="#6366f1"/>
  <text x="70" y="482.5" text-anchor="middle" class="num">4</text>
  <text x="92" y="483" class="title">模型与评测产物</text>
  <text x="64" y="510" class="body">LResNet18：11.46 M 参数 / 1.31 GFLOPs / 128 维</text>
  <text x="64" y="530" class="body">best.pt · metrics.json · 消融与延迟基准</text>

  <!-- RIGHT column -->
  <rect x="570" y="90" width="470" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="600" cy="118" r="12" fill="#0ea5e9"/>
  <text x="600" y="122.5" text-anchor="middle" class="num">1</text>
  <text x="622" y="123" class="title">浏览器前端</text>
  <text x="594" y="150" class="body">识别 / 录入 / 记录 / 设置 / 系统信息</text>
  <text x="594" y="170" class="body">原生 JS + Canvas，无构建步骤</text>

  <path d="M 805 188 L 805 206" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="570" y="210" width="470" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="600" cy="238" r="12" fill="#0ea5e9"/>
  <text x="600" y="242.5" text-anchor="middle" class="num">2</text>
  <text x="622" y="243" class="title">Flask API</text>
  <text x="594" y="270" class="body">7 个 REST 接口 + 同源静态资源</text>
  <text x="594" y="290" class="body">32 MB 上传上限 · 阈值热更新 · 场景化判定</text>

  <path d="M 805 308 L 805 326" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="570" y="330" width="470" height="96" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <circle cx="600" cy="358" r="12" fill="#6366f1"/>
  <text x="600" y="362.5" text-anchor="middle" class="num">3</text>
  <text x="622" y="363" class="title">推理引擎 FaceEngine</text>
  <text x="594" y="390" class="body">YuNet → 对齐 → 质量闸门 → 活体 → 128-d → 余弦检索</text>
  <text x="594" y="410" class="body">PyTorch 单例，CPU / GPU 自适应</text>

  <path d="M 805 428 L 805 446" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="570" y="450" width="470" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="600" cy="478" r="12" fill="#0ea5e9"/>
  <text x="600" y="482.5" text-anchor="middle" class="num">4</text>
  <text x="622" y="483" class="title">存储层</text>
  <text x="594" y="510" class="body">SQLite：user_info / face_feature / attendance_record</text>
  <text x="594" y="530" class="body">data/enroll 注册照 · 特征以 BLOB 持久化</text>

  <!-- weight handoff -->
  <path d="M 510 498 H 545 V 378 H 566" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="519" y="470" class="note" fill="#6366f1">best.pt 加载</text>

  <text x="540" y="604" text-anchor="middle" class="note">CPU 端到端 44 ms（含 HTTP）· 特征提取 19.3 ms · 千人比对 0.11 ms · 模型 43.8 MB</text>
</svg>
